<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chammy Florals - Order Success</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans overflow-x-hidden theme-cute">

  <!-- Header / Navigation (Matches Home Branding) -->
  <header class="sticky top-0 z-50 glass-header">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <!-- Brand Logo -->
      <a href="/" class="flex items-center gap-2.5 sm:gap-3 group text-decoration-none shrink-0">
        <div
          class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-rose-400 text-white flex items-center justify-center shadow-lg shadow-rose-500/20 group-hover:scale-105 transition-transform">
          <i class="fa-solid font-bold fa-spa text-base sm:text-lg"></i>
        </div>
        <span
          class="font-display font-bold text-lg sm:text-xl tracking-tight text-slate-900 group-hover:text-rose-600 transition-colors leading-tight">
          Chammy Florals
        </span>
      </a>

      <!-- Desktop Nav Items -->
      <nav class="hidden md:flex items-center gap-3">
        <a href="/" class="btn-shadcn-ghost flex items-center gap-2 text-decoration-none text-sm px-3 py-2">
          <i class="fa fa-home text-rose-500"></i>
          <span>Home</span>
        </a>
        <a href="/reviews.html" class="btn-shadcn-ghost flex items-center gap-2 text-decoration-none text-sm px-3 py-2">
          <i class="fa fa-star text-amber-400"></i>
          <span>Reviews</span>
        </a>
        <a href="/dashboard.html" class="btn-shadcn-ghost flex items-center gap-2 text-decoration-none text-sm px-3 py-2">
          <i class="fa fa-tachometer-alt text-rose-500"></i>
          <span>Dashboard</span>
        </a>
      </nav>
    </div>
  </header>

<main class="container py-5">
  <div class="text-center mb-5">
    <div
      class="badge rounded-circle p-3 mb-3 bg-gradient-to-tr from-rose-500 to-rose-400 text-white shadow-lg shadow-rose-500/30"
      style="display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;">
      <i class="fa fa-check fa-2x" aria-hidden="true"></i>
    </div>
    <h1 class="fw-bold text-pink mb-2">Order Placed Successfully! 🎉</h1>
    <p class="lead text-muted">Thank you for your order!</p>
  </div>

  <div id="orderContent" class="mt-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-6">
        <div class="card shadow-sm border-0" style="border-top:4px solid #ff77aa;">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <h5 class="mb-3"><i class="fa fa-receipt text-pink me-2"></i>Order Details</h5>
              <div class="alert" style="background:#fff7fb;border:1px solid #ffd7e8;">
                <div class="small text-muted mb-1">Order ID</div>
                <div class="fw-bold fs-4 text-pink" id="os-order-id"></div>
              </div>
            </div>

            <div class="mb-4">
              <div class="small text-muted mb-2 fw-semibold">Items</div>
              <div id="os-items-list" class="mb-3"></div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-6">
                <div class="small text-muted">Quantity</div>
                <div class="fw-semibold" id="os-total-quantity"></div>
              </div>
              <div class="col-6">
                <div class="small text-muted">Status</div>
                <span class="badge bg-warning text-dark" id="os-status"></span>
              </div>
              <div class="col-12">
                <div class="small text-muted">Total Amount</div>
                <div class="fw-bold text-pink fs-3">₱<span id="os-total"></span></div>
              </div>
            </div>

            <div class="d-grid gap-2">
              <a id="tg-track-btn" href="#" target="_blank" class="btn btn-info btn-lg text-white" style="background: #0088cc; border: none;">
                <i class="fa-brands fa-telegram me-2"></i>Track your order using our Telegram Bot
              </a>
              <a href="/dashboard.html" class="btn btn-pink btn-lg">
                <i class="fa fa-tachometer-alt me-2"></i>Go to Dashboard
              </a>
              <a href="/" class="btn btn-outline-secondary">
                <i class="fa fa-shopping-bag me-2"></i>Continue Shopping
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-4">
  <p>Follow us on:</p>
  <p class="mb-0">
    <a href="https://www.facebook.com/chammyfloralss/" target="_blank" class="text-decoration-none me-3">
      <i class="fab fa-facebook-f" style="color: #3b5998; font-size: 24px;"></i>
    </a>
    <a href="https://www.messenger.com/t/847673415097754" target="_blank" class="text-decoration-none me-3">
      <i class="fa-brands fa-facebook-messenger" style="color: #79a4ff; font-size: 24px;"></i>
    </a>
    <a href="https://www.instagram.com/chammyflorals/" target="_blank" class="text-decoration-none me-3">
      <i class="fa-brands fa-instagram" style="color: #ff6b57; font-size: 24px;"></i>
    </a>
  </p>
  <p class="mt-3 mb-0">© 2025 Chammy Florals. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/alert.js"></script>
  <script src="/js/order-success.js"></script>
  <link rel="stylesheet" href="/css/notify-prompt.css">
  
</body>
</html>
