<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chammy Florals - Order Success</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">Chammy Florals</a>
  </div>
</nav>

<main class="container py-5">
  <div class="text-center">
    <h1 class="fw-bold text-pink">Order Placed Successfully</h1>
    <p class="lead">Thank you for your order. Below are your order details.</p>
  </div>


  <div id="orderContent" class="mt-4">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Tracking ID: <span id="os-order-id" class="fw-bold"></span></h5>
        <p><strong>Flower Type:</strong> <span id="os-flower-type"></span></p>
        <p><strong>Quantity:</strong> <span id="os-quantity"></span></p>
        <p><strong>Total Fee:</strong> ₱<span id="os-total"></span></p>
        <p><strong>Status:</strong> <span id="os-status"></span></p>
      </div>
    </div>

    <button id="saveOrderBtn" class="btn btn-pink w-100">Save Receipt</button>

    <div class="mt-4 d-flex justify-content-between align-items-center">
      <div>
        <!-- Back to home removed; Save button lives in navbar -->
      </div>
      <div>
        <!-- Track this order button removed -->
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-4">
  <p>Follow us on:</p>
  <p class="mb-0">
    <a href="https://www.facebook.com/chammyfloralss/" target="_blank" class="text-decoration-none me-3">
      <i class="fab fa-facebook-f" style="color: #3b5998; font-size: 24px;"></i>
    </a>
    <a href="https://www.messenger.com/t/847673415097754" target="_blank" class="text-decoration-none me-3">
      <i class="fa-brands fa-facebook-messenger" style="color: #79a4ff; font-size: 24px;"></i>
    </a>
    <a href="https://www.instagram.com/chammyflorals/" target="_blank" class="text-decoration-none me-3">
      <i class="fa-brands fa-instagram" style="color: #ff6b57; font-size: 24px;"></i>
    </a>
  </p>
  <p class="mt-3 mb-0">© 2025 Chammy Florals. All rights reserved.</p>
</footer>

<script src="/js/order-success.js" defer></script>
</body>
</html>
