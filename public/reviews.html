
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chammy Florals - Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
  /* Reviews page design similar to index.html */
  body {
    overflow-x: hidden;
    background: #f8f9fa;
  }

  /* Hero section similar to index */
  .hero {
    background: linear-gradient(135deg, rgba(255,233,241,0.8) 0%, rgba(255,255,255,0.9) 100%);
    position: relative;
  }
  .hero .hero-inner { padding: 1rem; }
  .hero .hero-card {
    padding: 2rem 1rem;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  @media (min-width: 768px) {
    .hero .hero-inner { padding: 2rem; }
    .hero .hero-card { padding: 3rem 2rem; }
  }

  /* Stats card - enhanced to match hero style */
  .stats-card {
    background: white;
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    border: 1px solid rgba(0,0,0,0.05);
    margin-bottom: 2rem;
    margin-top: -100px;
  }

  .rating-display {
    text-align: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, #fff0f6 0%, #ffe9f0 100%);
    border-radius: 12px;
  }

  .rating-number {
    font-size: 4rem;
    font-weight: 700;
    color: #ff6f9b;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .rating-stars {
    color: #ffc107;
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }

  .rating-label {
    color: #666;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .review-count {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2d2d2d;
    margin-bottom: 0.25rem;
  }

  .verified-label {
    color: #666;
    font-size: 0.9rem;
  }

  /* Review cards - similar to product cards */
  .review-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 0;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  .review-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .review-content {
    padding: 1.5rem;
  }

  .review-image-wrapper {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: #f5f5f5;
    cursor: pointer;
    position: relative;
  }

  .review-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .review-image-wrapper:hover img {
    transform: scale(1.05);
  }

  .review-author {
    font-weight: 600;
    color: #2d2d2d;
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
  }

  .review-stars {
    color: #ffa500;
    font-size: 1rem;
    margin-bottom: 0.75rem;
  }

  .review-text {
    color: #666;
    line-height: 1.6;
    font-size: 0.95rem;
  }

  /* Filter section */
  .filter-section {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  #pageReviewsFilterStars {
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    min-width: 150px;
  }

  #pageReviewsFilterStars:focus {
    border-color: #ff6f9b;
    box-shadow: 0 0 0 3px rgba(255, 111, 155, 0.1);
    outline: none;
  }

  /* Form card - similar to modal styling */
  .form-card {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    position: sticky;
    top: 20px;
  }

  .form-header {
    background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
    color: white;
    padding: 1.5rem;
    border-radius: 16px 16px 0 0;
    text-align: center;
  }

  .form-header h5 {
    margin: 0;
    font-weight: 700;
  }

  /* Image modal */
  .image-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
  }

  .image-modal.active {
    display: flex;
  }

  .image-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .image-modal-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
  }

  .image-modal-close:hover {
    color: #ff6f9b;
  }

  /* Button styles similar to index */
  .btn-pink {
    background-color: #ff6f9b;
    border-color: #ff6f9b;
    color: white;
  }

  .btn-pink:hover {
    background-color: #e55a8a;
    border-color: #e55a8a;
    color: white;
  }

  .btn-outline-pink {
    color: #ff6f9b;
    border-color: #ff6f9b;
  }

  .btn-outline-pink:hover {
    background-color: #ff6f9b;
    border-color: #ff6f9b;
    color: white;
  }

  .text-pink {
    color: #ff6f9b !important;
  }

  .bg-pink {
    background-color: #ff6f9b !important;
  }

  /* Smooth transitions */
  .btn, .card, .badge {
    transition: all 0.3s ease;
  }

  /* Responsive design */
  @media (max-width: 767px) {
    .rating-number {
      font-size: 3rem;
    }

    .stats-card {
      padding: 1.5rem;
    }

    .review-content {
      padding: 1.25rem;
    }

    .review-image-wrapper {
      height: 180px;
    }

    .hero .hero-card {
      padding: 1.5rem 1rem;
    }
  }

  @media (min-width: 768px) and (max-width: 991px) {
    .hero .hero-card {
      padding: 2.5rem 1.5rem;
    }
  }

  @media (min-width: 992px) {
    .hero .hero-card {
      padding: 3rem 2rem;
    }
  }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">Chammy Florals</a>
  </div>
</nav>

<main>
  <section class="text-center py-4 py-md-5">
    <div class="hero">
      <div class="container hero-inner">
        <div class="hero-card rounded-4 shadow-sm text-center position-relative overflow-hidden">
          <!-- Decorative elements -->
          <div class="position-absolute top-0 start-0 opacity-25" style="font-size: 120px; color: #ff99bb; transform: rotate(-15deg); margin: -30px 0 0 -30px;">🌸</div>
          <div class="position-absolute bottom-0 end-0 opacity-25" style="font-size: 120px; color: #ff99bb; transform: rotate(15deg); margin: 0 -30px -30px 0;">💐</div>

          <div class="position-relative" style="z-index: 1;">
            <h1 class="fw-bold display-5 text-pink mb-3">Customer Reviews</h1>
            <p class="lead text-muted mb-4 mx-auto" style="max-width: 600px;">
              Bloom with love — hear what our customers are saying about their Chammy Florals experience.
            </p>
            <div class="d-flex justify-content-center gap-2 gap-md-3 flex-wrap mb-3">
              <button class="btn btn-outline-pink btn-lg px-4" id="heroReadReviewsBtn">
                <i class="fa fa-comments me-2"></i>Read Reviews
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="container my-5">

  <div class="row">
    <div class="col-12">
      <!-- Stats Card -->
      <div class="stats-card">
        <div class="row align-items-center g-4">
          <div class="col-md-4">
            <div class="rating-display">
              <div class="rating-number" id="reviewsAvg">5.0</div>
              <div class="rating-stars">★★★★★</div>
              <div class="rating-label">Average Rating</div>
            </div>
          </div>
          <div class="col-md-4 text-center">
            <div class="review-count" id="reviewsCount">2</div>
            <div class="verified-label">Total Reviews</div>
          </div>
          <div class="col-md-4">
            <div class="filter-section justify-content-center justify-content-md-end">
              <select id="pageReviewsFilterStars" class="form-select">
                <option value="">All Ratings</option>
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Reviews List -->
      <div id="reviewsContainer" class="row">
        <!-- reviews will be rendered here -->
      </div>
    </div>

  </section>
</main>

<!-- Image Modal -->
<div class="image-modal" id="imageModal">
  <span class="image-modal-close">&times;</span>
  <img id="modalImage" src="" alt="Review image">
</div>

<footer class="text-center py-4">
  <p>Follow us on:</p>
  <p class="mb-0">
    <a href="https://www.facebook.com/chammyfloralss/" target="_blank" class="text-decoration-none me-3">
      <i class="fab fa-facebook-f" style="color: #3b5998; font-size: 24px;"></i>
    </a>
    <a href="https://www.messenger.com/t/847673415097754" target="_blank" class="text-decoration-none me-3">
      <i class="fa-brands fa-facebook-messenger" style="color: #79a4ff; font-size: 24px;"></i>
    </a>
    <a href="https://www.instagram.com/chammyflorals/" target="_blank" class="text-decoration-none me-3">
      <i class="fab fa-instagram" style="color: #ff6b57; font-size: 24px;"></i>
    </a>
  </p>
  <p class="mt-3 mb-0">© 2025 Chammy Florals. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/reviews.js"></script>
<script src="/js/reviews-page.js"></script>
<script src="/js/reviews-inline.js"></script>
<link rel="stylesheet" href="/css/notify-prompt.css">
<script src="/js/floating-chat.js"></script>
</body>
</html>
