<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chammy Florals - Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <style>
  /* Reviews page inline tweaks: thumbnail left of content, small square 1:1 thumbnail */
  .review-card-row { display: flex; align-items: stretch; }
  /* small square thumbnail to the left of name/message */
  .review-thumb-wrap { flex: 0 0 70px; width: 70px; height: 70px; overflow: hidden; border-radius: 8px; margin-right: 12px; background: #fff; }
  .review-thumb-wrap img.review-thumb { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  /* ensure card body flex rows align at the top */
  .card-body.d-flex { align-items: flex-start; }
    @media (max-width: 767px) {
      .review-card-row { flex-direction: column; }
      .review-thumb-wrap { width: 70px; height: 70px; margin-right: 1; margin-bottom: 12px; align-self: center; }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">Chammy Florals</a>
    <div class="ms-auto">
      <button id="navSubmitReviewBtn" class="btn btn-pink btn-sm">Submit Review</button>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row">
    <div class="col-lg-8">
      <h1 class="h3 mb-4">Customer Reviews</h1>
      <div class="d-flex align-items-center gap-2 mb-3">
        <label for="pageReviewsFilterStars" class="mb-0 small text-muted">Filter by stars:</label>
        <select id="pageReviewsFilterStars" class="form-select form-select-sm w-auto">
          <option value="">All</option>
          <option value="5">5 stars</option>
          <option value="4">4 stars</option>
          <option value="3">3 stars</option>
          <option value="2">2 stars</option>
          <option value="1">1 star</option>
        </select>
      </div>
      <div id="reviewsContainer">
        <!-- reviews will be rendered here -->
      </div>
    </div>
    <aside class="col-lg-4">
      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h5 class="card-title">Add a review</h5>
          <form id="pageAddReviewForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label">Order ID</label>
              <input type="text" id="pageReviewOrderId" class="form-control" required />
              <div class="invalid-feedback">Order ID is required</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <select id="pageReviewStars" class="form-select" required>
                <option value="">Select stars</option>
                <option value="5">5 — Excellent</option>
                <option value="4">4 — Very good</option>
                <option value="3">3 — Good</option>
                <option value="2">2 — Fair</option>
                <option value="1">1 — Poor</option>
              </select>
              <div class="invalid-feedback">Please select a rating</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea id="pageReviewMessage" class="form-control" rows="4" required></textarea>
              <div class="invalid-feedback">Message is required</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Upload an image</label>
              <input type="file" id="pageReviewImage" accept="image/*" class="form-control" required>
              <div class="form-text">Add a photo of your received order (max 5MB).</div>
            </div>
            <div id="pageAddReviewError" class="text-danger small mb-2" style="display:none"></div>
            <button type="submit" class="btn btn-pink w-100">Submit Review</button>
          </form>
        </div>
      </div>
    </aside>
  </div>
</main>

<!-- Image modal for larger preview -->
<div class="modal fade" id="reviewImageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-body p-0">
        <button type="button" class="btn-close position-absolute m-3" data-bs-dismiss="modal" aria-label="Close" style="z-index:5;"></button>
        <div style="width:100%;height:0;padding-bottom:66.66%;position:relative;">
          <img id="reviewImageModalImg" src="" alt="Review image" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#111;" />
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/reviews.js" defer></script>
<script src="/js/reviews-page.js" defer></script>
</body>
</html>
