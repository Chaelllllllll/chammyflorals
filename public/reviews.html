
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chammy Florals - Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <style>
  /* Professional reviews page design */
  body {
    overflow-x: hidden;
    background: #f8f9fa;
  }

  /* Stats card - clean and professional */
  .stats-card {
    background: white;
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.05);
    margin-bottom: 2rem;
  }

  .rating-display {
    text-align: center;
    padding: 1.5rem;
    background: linear-gradient(135deg, #fff0f6 0%, #ffe9f0 100%);
    border-radius: 12px;
  }

  .rating-number {
    font-size: 4rem;
    font-weight: 700;
    color: #ff6f9b;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .rating-stars {
    color: #ffc107;
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }

  .rating-label {
    color: #666;
    font-size: 0.9rem;
    font-weight: 500;
  }

  .review-count {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2d2d2d;
    margin-bottom: 0.25rem;
  }

  .verified-label {
    color: #666;
    font-size: 0.9rem;
  }

  /* Review cards - clean professional design */
  .review-card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 0;
    margin-bottom: 1.5rem;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  .review-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .review-content {
    padding: 1.5rem;
  }

  .review-image-wrapper {
    width: 100%;
    height: 200px;
    overflow: hidden;
    background: #f5f5f5;
    cursor: pointer;
    position: relative;
  }

  .review-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .review-image-wrapper:hover img {
    transform: scale(1.05);
  }

  .review-author {
    font-weight: 600;
    color: #2d2d2d;
    font-size: 1.1rem;
    margin-bottom: 0.5rem;
  }

  .review-stars {
    color: #ffa500;
    font-size: 1rem;
    margin-bottom: 0.75rem;
  }

  .review-text {
    color: #666;
    line-height: 1.6;
    font-size: 0.95rem;
  }

  /* Filter section */
  .filter-section {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  #pageReviewsFilterStars {
    border-radius: 8px;
    border: 1px solid #ddd;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    min-width: 150px;
  }

  #pageReviewsFilterStars:focus {
    border-color: #ff6f9b;
    box-shadow: 0 0 0 3px rgba(255, 111, 155, 0.1);
    outline: none;
  }

  /* Form card */
  .form-card {
    background: white;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    position: sticky;
    top: 20px;
  }

  .form-header {
    background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
    color: white;
    padding: 1.5rem;
    border-radius: 12px 12px 0 0;
    text-align: center;
  }

  .form-header h5 {
    margin: 0;
    font-weight: 700;
  }

  /* Image modal */
  .image-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
  }

  .image-modal.active {
    display: flex;
  }

  .image-modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .image-modal-close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
  }

  .image-modal-close:hover {
    color: #ff6f9b;
  }

  @media (max-width: 767px) {
    .rating-number {
      font-size: 3rem;
    }

    .stats-card {
      padding: 1.5rem;
    }

    .review-content {
      padding: 1.25rem;
    }

    .review-image-wrapper {
      height: 180px;
    }
  }

  @media (max-width: 991px) {
    .review-image-wrapper {
      order: -1;
    }
  }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="/">Chammy Florals</a>
    <div class="ms-auto">
      <button id="navSubmitReviewBtn" class="btn btn-pink btn-sm">Submit Review</button>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold mb-2" style="color: #2d2d2d;">Customer Reviews</h1>
    <p class="text-muted">See what our customers are saying about their experience</p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <!-- Stats Card -->
      <div class="stats-card">
        <div class="row align-items-center g-4">
          <div class="col-md-4">
            <div class="rating-display">
              <div class="rating-number" id="reviewsAvg">5.0</div>
              <div class="rating-stars">★★★★★</div>
              <div class="rating-label">Average Rating</div>
            </div>
          </div>
          <div class="col-md-4 text-center">
            <div class="review-count" id="reviewsCount">2</div>
            <div class="verified-label">Total Reviews</div>
          </div>
          <div class="col-md-4">
            <div class="filter-section justify-content-center justify-content-md-end">
              <select id="pageReviewsFilterStars" class="form-select">
                <option value="">All Ratings</option>
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Reviews List -->
      <div id="reviewsContainer" class="row">
        <!-- reviews will be rendered here -->
      </div>
    </div>
    <aside class="col-lg-4">
      <div class="form-card mb-3">
        <div class="form-header">
          <h5><i class="fa fa-pen-to-square me-2"></i>Write a Review</h5>
          <p class="mb-0 small" style="opacity: 0.9;">Share your experience with us</p>
        </div>
        <div class="p-4">
          <form id="pageAddReviewForm" class="needs-validation" novalidate>
            <div class="mb-3">
              <label class="form-label fw-semibold small" style="color: #2d2d2d;">
                Order ID
              </label>
              <input type="text" id="pageReviewOrderId" class="form-control" placeholder="e.g., A5DW7DW" required />
              <div class="invalid-feedback">Order ID is required</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small" style="color: #2d2d2d;">
                Rating
              </label>
              <select id="pageReviewStars" class="form-select" required>
                <option value="">Select rating</option>
                <option value="5">★★★★★ Excellent</option>
                <option value="4">★★★★☆ Very Good</option>
                <option value="3">★★★☆☆ Good</option>
                <option value="2">★★☆☆☆ Fair</option>
                <option value="1">★☆☆☆☆ Poor</option>
              </select>
              <div class="invalid-feedback">Please select a rating</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small" style="color: #2d2d2d;">
                Your Review
              </label>
              <textarea id="pageReviewMessage" class="form-control" rows="4" placeholder="Tell us about your experience..." required></textarea>
              <div class="invalid-feedback">Message is required</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small" style="color: #2d2d2d;">
                Photo
              </label>
              <input type="file" id="pageReviewImage" accept="image/*" class="form-control" required>
              <div class="form-text small text-muted">Max 5MB</div>
            </div>
            <div id="pageAddReviewError" class="alert alert-danger small mb-3" role="alert" style="display:none;"></div>
            <button type="submit" class="btn btn-pink w-100 py-2 fw-semibold">
              <i class="fa fa-paper-plane me-2"></i>Submit Review
            </button>
          </form>
        </div>
      </div>
    </aside>
  </div>
</main>

<!-- Image Modal -->
<div class="image-modal" id="imageModal">
  <span class="image-modal-close" onclick="window.closeImageModal()">&times;</span>
  <img id="modalImage" src="" alt="Review image">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/reviews.js"></script>
<script src="/js/reviews-page.js"></script>
<script>
  // Image modal functionality - must be available globally
  window.openImageModal = function(imageSrc) {
    console.log('Opening modal with image:', imageSrc);
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    if (modal && modalImg) {
      modalImg.src = imageSrc;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      console.log('Modal opened');
    } else {
      console.error('Modal elements not found', { modal, modalImg });
    }
  }

  window.closeImageModal = function() {
    console.log('Closing modal');
    const modal = document.getElementById('imageModal');
    if (modal) {
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }
  }

  // Close modal on background click
  document.addEventListener('click', function(e) {
    if (e.target.id === 'imageModal') {
      window.closeImageModal();
    }
  });

  // Close modal on ESC key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeImageModal();
    }
  });
</script>
</body>
</html>
