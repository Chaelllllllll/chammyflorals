<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Customer Reviews - Chammy Florals</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css">

  <script>
    document.documentElement.classList.remove('dark');
  </script>
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans transition-colors duration-300 theme-cute">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-50 glass-header">
    <nav class="navbar navbar-expand-md py-2 px-0 border-0 bg-transparent">
      <div class="container mx-auto px-4 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5 sm:gap-3 group text-decoration-none shrink-0">
          <div
            class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-rose-600 to-rose-400 text-white flex items-center justify-center shadow-lg shadow-rose-500/20 group-hover:scale-105 transition-transform">
            <i class="fa-solid fa-spa text-lg"></i>
          </div>
          <span
            class="font-display font-bold text-lg sm:text-xl tracking-tight text-slate-900 group-hover:text-rose-600 transition-colors">
            Chammy Florals
          </span>
        </a>

        <a href="index.html"
          class="btn-shadcn-ghost flex items-center gap-2 text-decoration-none text-xs sm:text-sm px-3 py-2">
          <i class="fa fa-home text-rose-500"></i>
          <span>Home</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="flex-grow">
    <!-- Hero Banner -->
    <section class="relative py-12 md:py-16 overflow-hidden">
      <div class="container mx-auto px-4">
        <div class="glass-card p-8 md:p-12 text-center max-w-4xl mx-auto relative shadow-2xl">
          <h1 class="font-display text-4xl sm:text-5xl font-bold text-slate-900 mb-6">Customer Reviews</h1>
          <div class="flex flex-wrap items-center justify-center gap-3">
            <button class="btn-shadcn-primary px-6 py-2.5" id="heroSubmitReviewBtn">
              <i class="fa fa-pen me-2"></i>Submit a Review
            </button>
            <button class="btn-shadcn-ghost px-6 py-2.5" id="heroReadReviewsBtn">
              <i class="fa fa-comments me-2"></i>Explore All Reviews
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Rating Summary & Reviews Section -->
    <section class="container mx-auto px-4 pb-16">

      <!-- Stats Box -->
      <div class="glass-card p-6 md:p-8 mb-8 shadow-xl">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">

          <div class="text-center p-6 rounded-2xl bg-rose-50 border border-rose-200/60">
            <div class="text-5xl font-bold text-rose-600 leading-none mb-2" id="reviewsAvg">5.0</div>
            <div class="text-amber-400 text-lg mb-1">★★★★★</div>
            <div class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Average Rating</div>
          </div>

          <div>
            <label class="form-label font-semibold text-xs text-slate-700 mb-1.5 block">Filter by Star Rating</label>
            <select id="pageReviewsFilterStars" class="shadcn-input">
              <option value="">All Ratings</option>
              <option value="5">★★★★★ (5 Stars)</option>
              <option value="4">★★★★☆ (4 Stars)</option>
              <option value="3">★★★☆☆ (3 Stars)</option>
              <option value="2">★★☆☆☆ (2 Stars)</option>
              <option value="1">★☆☆☆☆ (1 Star)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Reviews Grid -->
      <div id="reviewsContainer" class="row g-4">
        <!-- Rendered dynamically by reviews.js -->
      </div>
    </section>
  </main>

  <!-- Image Lightbox Modal -->
  <div class="image-modal fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden items-center justify-center p-4"
    id="imageModal">
    <span
      class="image-modal-close absolute top-6 right-8 text-white text-4xl cursor-pointer hover:text-rose-400 transition-colors">&times;</span>
    <img id="modalImage" src="" alt="Review detail view" class="max-w-full max-h-[85vh] rounded-2xl shadow-2xl">
  </div>

  <!-- Submit a Review Modal -->
  <div class="modal fade" id="pageAddReviewModal" tabindex="-1" aria-labelledby="pageAddReviewModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title font-display text-2xl font-bold text-slate-900" id="pageAddReviewModalLabel">Write a Review</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="pageAddReviewError" class="text-danger mb-3" style="display:none;"></div>
          <form id="pageAddReviewForm" class="needs-validation" novalidate>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div>
                <label for="pageReviewOrderId" class="form-label font-semibold text-xs text-slate-700 mb-1.5 block">Order ID</label>
                <input type="text" id="pageReviewOrderId" class="shadcn-input" placeholder="e.g. 1042" required />
              </div>
              <div>
                <label for="pageReviewStars" class="form-label font-semibold text-xs text-slate-700 mb-1.5 block">Rating</label>
                <select id="pageReviewStars" class="shadcn-input" required>
                  <option value="" selected disabled>Select a rating</option>
                  <option value="5">★★★★★ (5 Stars)</option>
                  <option value="4">★★★★☆ (4 Stars)</option>
                  <option value="3">★★★☆☆ (3 Stars)</option>
                  <option value="2">★★☆☆☆ (2 Stars)</option>
                  <option value="1">★☆☆☆☆ (1 Star)</option>
                </select>
              </div>
            </div>
            <div class="mb-6">
              <label for="pageReviewMessage" class="form-label font-semibold text-xs text-slate-700 mb-1.5 block">Your Review</label>
              <textarea id="pageReviewMessage" class="shadcn-input" style="height:auto;min-height:7rem;resize:vertical;" placeholder="Tell us about your experience..." required></textarea>
            </div>
            <div class="mb-6">
              <label for="pageReviewImage" class="form-label font-semibold text-xs text-slate-700 mb-1.5 block">Photo</label>
              <input type="file" id="pageReviewImage" class="shadcn-input" accept="image/*" required />
            </div>
            <div class="text-end">
              <button type="submit" class="btn-shadcn-primary px-6 py-2.5">
                <i class="fa fa-paper-plane me-2"></i>Submit Review
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-10 text-center">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-center gap-6 mb-4">
        <a href="https://www.facebook.com/chammyfloralss/" target="_blank"
          class="text-slate-500 hover:text-rose-500 text-xl"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.messenger.com/t/847673415097754" target="_blank"
          class="text-slate-500 hover:text-rose-500 text-xl"><i class="fa-brands fa-facebook-messenger"></i></a>
        <a href="https://www.instagram.com/chammyflorals/" target="_blank"
          class="text-slate-500 hover:text-rose-500 text-xl"><i class="fab fa-instagram"></i></a>
      </div>
      <p class="text-xs text-slate-400">&copy; 2025 Chammy Florals. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/alert.js"></script>
  <script src="/js/reviews.js"></script>
  <script src="/js/reviews-page.js"></script>
  <script src="/js/reviews-inline.js"></script>
</body>

</html>
