<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Chammy Florals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, rgba(255,233,241,0.8) 0%, rgba(255,255,255,0.9) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .login-container {
      max-width: 450px;
      width: 100%;
    }
    
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(255, 111, 155, 0.15);
      padding: 40px;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 35px;
    }
    
    .logo-section i {
      font-size: 60px;
      background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 15px;
    }
    
    .logo-section h2 {
      color: #333;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 8px;
    }
    
    .logo-section p {
      color: #666;
      font-size: 15px;
    }
    
    .form-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .form-control {
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #f0f0f0;
      transition: all 0.3s;
      font-size: 15px;
    }
    
    .form-control:focus {
      border-color: #ff6f9b;
      box-shadow: 0 0 0 0.2rem rgba(255, 111, 155, 0.15);
      outline: none;
    }
    
    .password-field {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #999;
      cursor: pointer;
      padding: 0;
      font-size: 16px;
    }
    
    .password-toggle:hover {
      color: #ff6f9b;
    }
    
    .btn-pink {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 111, 155, 0.3);
    }
    
    .btn-pink:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 111, 155, 0.4);
      color: white;
    }
    

    .signup-link,
    .back-home {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
    
    .signup-link a,
    .back-home a {
      color: #ff6f9b;
      text-decoration: none;
      font-weight: 600;
    }
    
    .signup-link a:hover,
    .back-home a:hover {
      text-decoration: underline;
    }
    
    .alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      border: none;
    }
    
    .alert-danger {
      background: #fee;
      color: #c33;
    }
    
    .alert-success {
      background: #efe;
      color: #383;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: 8px;
      margin-bottom: 20px;
    }
    
    .forgot-password a {
      color: #ff6f9b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    
    .forgot-password a:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <i class="fas fa-flower"></i>
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <div id="alertContainer"></div>

      <!-- Email/Password Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            name="email" 
            placeholder="your@email.com" 
            required
          >
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="password-field">
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              name="password" 
              placeholder="Enter your password" 
              required
            >
            <button type="button" class="password-toggle" onclick="togglePassword()">
              <i class="fas fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-pink" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
          <span id="loginBtnSpinner" class="d-none">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Signing in...
          </span>
        </button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="customer-signup.html">Sign Up</a>
      </div>

      <div class="back-home">
        <a href="index.html"><i class="fas fa-home me-1"></i>Back to Home</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px; border: none;">
        <div class="modal-header" style="background: linear-gradient(135deg, #ff99bb 0%, #ff6f9b 100%); border: none; border-radius: 20px 20px 0 0;">
          <h5 class="modal-title text-white"><i class="fa fa-key me-2"></i>Forgot Password</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div id="forgotPasswordAlert"></div>
          <p class="text-muted mb-3">Enter your email address and we'll send you a link to reset your password.</p>
          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label class="form-label" style="font-weight: 600;">Email Address *</label>
              <input type="email" class="form-control" id="forgotEmail" required style="border: 2px solid #e8e8e8; border-radius: 10px; padding: 12px;">
            </div>
            <button type="submit" class="btn w-100" style="background: linear-gradient(135deg, #ff99bb 0%, #ff6f9b 100%); color: white; padding: 12px; border-radius: 10px; font-weight: 600; border: none;">
              <i class="fa fa-paper-plane me-2"></i>Send Reset Link
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3000' 
      : 'https://chammyflorals.vercel.app';
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
      }
    }

    // Show alert message
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    // Email/Password Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const loginBtn = document.getElementById('loginBtn');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginBtnSpinner = document.getElementById('loginBtnSpinner');
      
      loginBtn.disabled = true;
      loginBtnText.classList.add('d-none');
      loginBtnSpinner.classList.remove('d-none');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Store auth token and customer data
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('customer', JSON.stringify(data.customer));
          
          showAlert('Login successful! Redirecting...', 'success');
          
          // Redirect to dashboard
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          showAlert(data.error || 'Login failed. Please check your credentials.');
          loginBtn.disabled = false;
          loginBtnText.classList.remove('d-none');
          loginBtnSpinner.classList.add('d-none');
        }
      } catch (error) {
        console.error('Login error:', error);
        showAlert('An error occurred. Please try again.');
        loginBtn.disabled = false;
        loginBtnText.classList.remove('d-none');
        loginBtnSpinner.classList.add('d-none');
      }
    });

    // Forgot Password Modal
    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      const modal = new bootstrap.Modal(document.getElementById('forgotPasswordModal'));
      modal.show();
    });

    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('forgotEmail').value.trim();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalHtml = submitBtn.innerHTML;
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Sending...';
      
      try {
        const response = await fetch(`${API_URL}/api/auth/forgot-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('forgotPasswordAlert').innerHTML = `
            <div class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: 10px;">
              <i class="fa fa-check-circle me-2"></i>
              ${data.message}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          `;
          document.getElementById('forgotPasswordForm').reset();
        } else {
          document.getElementById('forgotPasswordAlert').innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 10px;">
              <i class="fa fa-exclamation-circle me-2"></i>
              ${data.error || 'Failed to send reset link'}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          `;
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('forgotPasswordAlert').innerHTML = `
          <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 10px;">
            <i class="fa fa-exclamation-circle me-2"></i>
            An error occurred. Please try again.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalHtml;
      }
    });


  </script>
</body>
</html>
