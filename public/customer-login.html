<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Login - Chammy Florals</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="styles.css">

  <script>
    document.documentElement.classList.remove('dark');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans relative overflow-hidden transition-colors duration-300">

  <!-- Ambient Light Effects -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-rose-500/10 blur-[100px] rounded-full pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-72 h-72 bg-emerald-500/10 blur-[80px] rounded-full pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Login Card (shadcn Glassmorphism) -->
    <div class="glass-card p-8 md:p-10 shadow-2xl text-center">
      
      <!-- Brand Header -->
      <div class="mb-8">
        <a href="index.html" class="inline-flex items-center gap-3 text-decoration-none group mb-4">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-600 to-rose-400 text-white flex items-center justify-center text-2xl shadow-lg shadow-rose-500/20 group-hover:scale-105 transition-transform">
            <i class="fa-solid fa-spa"></i>
          </div>
        </a>
        <h2 class="font-display text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Welcome to Chammy Florals</h2>
      </div>

      <div id="alertContainer" class="mb-4"></div>

      <!-- Google Sign In Only (Supabase OAuth) -->
      <div class="space-y-4 py-2">
        <button id="googleLoginBtn" onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 py-3.5 px-6 rounded-2xl bg-white border border-slate-200 text-slate-800 font-bold text-sm shadow-md hover:shadow-xl hover:bg-slate-50 active:scale-[0.98] transition-all group">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <!-- Footer Links -->
      <div class="mt-8 pt-6 border-t border-slate-200/60 text-center space-y-3">
        <p class="text-xs mb-0">
          <a href="index.html" class="text-slate-400 hover:text-slate-600 text-decoration-none">
            <i class="fas fa-arrow-left me-1"></i>Back to Storefront
          </a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/alert.js"></script>
  <script>
    const SUPABASE_URL = 'https://hzrmqafxvplqjalxmsdh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6cm1xYWZ4dnBscWphbHhtc2RoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2MjQ0NTY0NCwiZXhwIjoyMDc4MDIxNjQ0fQ.A9S9HRjFE69srUPsQ3lqkce-BWLoMm5ub6PRCbdaYY0';

    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show text-xs rounded-xl" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    async function handleGoogleLogin() {
      const googleBtn = document.getElementById('googleLoginBtn');
      if (googleBtn) {
        googleBtn.disabled = true;
        googleBtn.innerHTML = `
          <span class="spinner-border spinner-border-sm text-rose-500 me-2" role="status"></span>
          <span>Connecting to Google...</span>
        `;
      }

      if (!supabaseClient) {
        showAlert('Supabase client failed to load. Please check your network connection.');
        resetGoogleBtn();
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/customer-login.html'
          }
        });

        if (error) {
          console.error('Supabase OAuth error:', error);
          showAlert(error.message || 'Failed to sign in with Google');
          resetGoogleBtn();
        }
      } catch (err) {
        console.error('Google login exception:', err);
        showAlert('An error occurred during Google sign-in. Please try again.');
        resetGoogleBtn();
      }
    }

    function resetGoogleBtn() {
      const googleBtn = document.getElementById('googleLoginBtn');
      if (googleBtn) {
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!supabaseClient) return;

      const isOAuthRedirect = window.location.hash.includes('access_token') || 
                              window.location.hash.includes('error') || 
                              window.location.search.includes('code=');

      if (isOAuthRedirect) {
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          if (session && session.user) {
            handleSuccessfulSession(session);
          }

          supabaseClient.auth.onAuthStateChange((event, session) => {
            if ((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session && session.user) {
              handleSuccessfulSession(session);
            }
          });
        } catch (err) {
          console.error('Session check error:', err);
        }
      }
    });

    async function handleSuccessfulSession(session) {
      const user = session.user;
      const avatarUrl = user.user_metadata?.avatar_url || user.user_metadata?.picture || user.identities?.[0]?.identity_data?.avatar_url || user.identities?.[0]?.identity_data?.picture;
      const fullName = user.user_metadata?.full_name || user.user_metadata?.name || (user.email ? user.email.split('@')[0] : 'Customer');

      // Determine if this Google account is an admin. If so, skip the customer
      // flow and send the admin to the admin dashboard with a minted admin JWT.
      try {
        const roleRes = await fetch('/api/auth/detect-role', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: session.access_token })
        });
        if (roleRes.ok) {
          const roleData = await roleRes.json();
          if (roleData.role === 'admin' && roleData.token) {
            localStorage.setItem('adminToken', roleData.token);
            localStorage.setItem('admin', JSON.stringify(roleData.admin || {}));
            showAlert('Admin login successful! Redirecting to dashboard...', 'success');
            setTimeout(() => { window.location.href = '/admin/dashboard.html'; }, 800);
            return;
          }
        }
      } catch (e) {
        console.warn('Admin role detection failed, continuing as customer:', e);
      }

      const customer = {
        id: user.id,
        name: fullName,
        email: user.email,
        profile_picture: avatarUrl
      };

      // Upsert customer profile picture and details into database customers table
      try {
        if (supabaseClient) {
          const { data: dbCust, error: upsertErr } = await supabaseClient
            .from('customers')
            .upsert({
              email: user.email.toLowerCase().trim(),
              name: fullName,
              profile_picture: avatarUrl || null,
              google_id: user.id,
              email_verified: true,
              updated_at: new Date().toISOString()
            }, { onConflict: 'email' })
            .select('id, name, email, profile_picture')
            .single();

          if (!upsertErr && dbCust) {
            customer.id = dbCust.id;
            customer.name = dbCust.name || customer.name;
            customer.profile_picture = dbCust.profile_picture || avatarUrl;
          }
        }
      } catch (e) {
        console.warn('Supabase customer upsert warning:', e);
      }

      localStorage.setItem('auth_token', session.access_token);
      localStorage.setItem('customer', JSON.stringify(customer));
      localStorage.setItem('customer_user', JSON.stringify(customer));
      localStorage.setItem('user', JSON.stringify(customer));

      showAlert('Login successful! Redirecting to dashboard...', 'success');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
    }
  </script>
</body>
</html>
