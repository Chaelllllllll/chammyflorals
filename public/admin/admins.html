<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chammy Florals - Admins</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="/flowers/cherry-blossom.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/admin/dashboard.html">
        <div class="fw-bold">Chammy Florals</div>
      </a>
      <!-- Mobile hamburger toggler -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-controls="adminNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/admin/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/reports.html">Transactions</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/todo.html">To Do</a></li>
          <li class="nav-item"><a class="nav-link active" href="/admin/admins.html">Admins</a></li>
          <li class="nav-item ms-2 d-flex align-items-center">
            <button class="btn btn-pink btn-sm me-3" id="logoutButton">Logout</button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pt-4">
    <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center justify-content-between mb-3 gap-2">
      <div>
        <h2 class="mb-0">Admins</h2>
      </div>
      <div class="d-flex gap-2 w-100 justify-content-sm-end">
        <input id="searchInput" class="form-control form-control-sm flex-grow-1" style="min-width:160px; max-width:420px;" placeholder="Search by name, email, or PSID">
      </div>
    </div>

    <div class="row">
      <div class="col-lg-15 mb-4">
        <div class="card shadow-sm">
      <div class="card-body">
            <div class="table-responsive">
              <table class="table minimalist-table admin-table table-hover">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>PSID</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th class="actions" style="width:140px">Actions</th>
                  </tr>
                </thead>
                <tbody id="adminsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Edit/Create Modal -->
  <div class="modal fade" id="adminEditModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="adminEditTitle">Edit Admin</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="adminModalForm">
            <input type="hidden" id="modalAdminId">
            <div class="mb-2"><label class="form-label">Name</label><input id="modalName" class="form-control"></div>
            <div class="mb-2"><label class="form-label">PSID</label><input id="modalPsid" class="form-control" readonly></div>
            <div class="mb-2"><label class="form-label">Email</label><input id="modalEmail" class="form-control"></div>
            <div class="mb-2"><label class="form-label">Password</label><input id="modalPassword" type="password" class="form-control"></div>
            <div class="mb-2"><label class="form-label">Status</label>
              <select id="modalStatus" class="form-control"><option>Approved</option><option>Not Approved</option></select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button id="modalDeleteBtn" type="button" class="btn btn-danger me-auto d-none">Delete</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button id="modalSaveBtn" type="button" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-admins.js"></script>
</body>
</html>
