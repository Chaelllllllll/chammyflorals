<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chammy Florals - To Do</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="shortcut icon" href="/flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-page">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="/admin/dashboard.html">Chammy Florals</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/admin/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/reviews.html">Reviews</a></li>
          <li class="nav-item"><a class="nav-link" href="/admin/reports.html">Transactions</a></li>
          <li class="nav-item"><a class="nav-link active" href="/admin/todo.html">To Do</a></li>
           <li class="nav-item"><a class="nav-link" href="/admin/admins.html">Admins</a></li>
          <li class="nav-item ms-3 me-3"><button id="logoutButton" class="btn btn-pink btn-sm">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3 gap-3 flex-wrap">
      <div>
        <h3 class="mb-0">To Do Orders</h3>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <div class="input-group input-group-sm me-2">
          <span class="input-group-text"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85zm-5.442 1.11a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></span>
          <input id="todoSearch" class="form-control" placeholder="Search Order ID, name or item" aria-label="Search orders">
        </div>
        <select id="statusFilter" class="form-select form-select-sm">
          <option value="">All statuses</option>
          <option value="Pending">Pending</option>
          <option value="Processing">Processing</option>
        </select>
        <select id="sortSelect" class="form-select form-select-sm ms-2">
          <option value="desc">Newest first</option>
          <option value="asc" selected>Oldest first</option>
        </select>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="small text-muted">Showing <span id="todoCount">—</span> to-do orders</div>
          <div>
            <button id="refreshTodo" class="btn btn-sm btn-outline-secondary">Refresh</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-hover align-middle" aria-describedby="todoList">
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="todoTable">
              <tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Order details modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Order Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="orderDetailsContent">
          <!-- populated by JS -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-todo.js"></script>
</body>
</html>
