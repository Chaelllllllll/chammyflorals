<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chammy Florals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* Minimal centered login card */
    body { background: #fffafc; }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { max-width: 420px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
    .brand-mark { width:48px; height:48px; object-fit:cover; border-radius:8px; }
    .form-title { font-weight:600; color: #d63384; }
    .btn-pink { background: #ff99bb; color: #fff; border: none; }
    .btn-pink:hover { background: #ff7aa6; color: #fff; }
    .back-link { color: #d63384; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4">
      <div class="card-body">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div>
            <div class="form-title">Chammy Florals</div>
          </div>
        </div>

        <form id="adminLoginForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="adminEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="adminEmail" required autofocus placeholder="you@domain.com">
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label for="adminPassword" class="form-label">Password</label>
            <input type="password" class="form-control" id="adminPassword" required placeholder="Password">
            <div class="invalid-feedback">Please enter a password.</div>
          </div>
          <div class="d-flex align-items-center justify-content-between gap-2">
            <a href="/" class="back-link">← Back to site</a>
            <button type="submit" class="btn btn-pink">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Error Modal -->
  <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="errorModalLabel">Login Error</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="errorModalContent">
          <!-- Error message will be populated here -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-login.js"></script>
  <script>
    // Check if already logged in
    (async () => {
      const token = localStorage.getItem('adminToken');
      if (token) {
        try {
          const response = await fetch('/api/admin/verify-token', {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (response.ok) {
            window.location.href = '/admin/dashboard.html';
          } else {
            localStorage.removeItem('adminToken');
          }
        } catch (error) {
          console.error('Token verification error:', error);
          localStorage.removeItem('adminToken');
        }
      }
    })();
  </script>
</body>
</html>
