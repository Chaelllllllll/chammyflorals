<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - Chammy Florals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, rgba(255,233,241,0.8) 0%, rgba(255,255,255,0.9) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .verify-container {
      max-width: 450px;
      width: 100%;
    }
    
    .verify-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(255, 111, 155, 0.15);
      padding: 40px;
      text-align: center;
    }
    
    .logo-section {
      margin-bottom: 35px;
    }
    
    .logo-section i {
      font-size: 70px;
      background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    
    .logo-section h2 {
      color: #333;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 12px;
    }
    
    .logo-section p {
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }
    
    .email-display {
      background: rgba(255, 111, 155, 0.1);
      color: #ff6f9b;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      margin: 20px 0;
      display: inline-block;
    }
    
    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 30px 0;
    }
    
    .otp-input {
      width: 55px;
      height: 55px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      border: 2px solid #f0f0f0;
      border-radius: 10px;
      transition: all 0.3s;
    }
    
    .otp-input:focus {
      border-color: #ff6f9b;
      box-shadow: 0 0 0 0.2rem rgba(255, 111, 155, 0.15);
      outline: none;
    }
    
    .btn-pink {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #ff6f9b 0%, #ff99bb 100%);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(255, 111, 155, 0.3);
      margin-top: 10px;
    }
    
    .btn-pink:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 111, 155, 0.4);
      color: white;
    }
    
    .btn-pink:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .resend-section {
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }
    
    .resend-btn {
      color: #ff6f9b;
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
    
    .resend-btn:hover {
      color: #ff99bb;
    }
    
    .resend-btn:disabled {
      color: #999;
      cursor: not-allowed;
      text-decoration: none;
    }
    
    .alert {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      border: none;
      margin-bottom: 20px;
    }
    
    .alert-danger {
      background: #fee;
      color: #c33;
    }
    
    .alert-success {
      background: #efe;
      color: #383;
    }
    
    .back-link {
      margin-top: 20px;
      font-size: 14px;
    }
    
    .back-link a {
      color: #ff6f9b;
      text-decoration: none;
      font-weight: 600;
    }
    
    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="verify-container">
    <div class="verify-card">
      <div class="logo-section">
        <i class="fas fa-envelope-circle-check"></i>
        <h2>Verify Your Email</h2>
        <p>We've sent a 6-digit verification code to:</p>
        <div class="email-display" id="emailDisplay">Loading...</div>
      </div>

      <div id="alertContainer"></div>

      <form id="verifyForm">
        <div class="otp-inputs">
          <input type="text" maxlength="1" class="otp-input" id="otp1" required>
          <input type="text" maxlength="1" class="otp-input" id="otp2" required>
          <input type="text" maxlength="1" class="otp-input" id="otp3" required>
          <input type="text" maxlength="1" class="otp-input" id="otp4" required>
          <input type="text" maxlength="1" class="otp-input" id="otp5" required>
          <input type="text" maxlength="1" class="otp-input" id="otp6" required>
        </div>

        <button type="submit" class="btn btn-pink" id="verifyBtn">
          <span id="verifyBtnText">Verify Email</span>
          <span id="verifyBtnSpinner" class="d-none">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Verifying...
          </span>
        </button>
      </form>

      <div class="resend-section">
        Didn't receive the code?
        <button type="button" class="resend-btn" id="resendBtn" onclick="resendOTP()">
          <span id="resendText">Resend Code</span>
          <span id="resendTimer" class="d-none"></span>
        </button>
      </div>

      <div class="back-link">
        <a href="customer-signup.html"><i class="fas fa-arrow-left me-1"></i>Back to Sign Up</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3000' 
      : 'https://chamflorals.vercel.app';

    let resendCooldown = 0;
    let cooldownInterval = null;

    // Get email from session storage
    const email = sessionStorage.getItem('verifyEmail');
    if (!email) {
      window.location.href = 'customer-signup.html';
    } else {
      document.getElementById('emailDisplay').textContent = email;
    }

    // Show alert message
    function showAlert(message, type = 'danger') {
      const alertContainer = document.getElementById('alertContainer');
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    // OTP input handling
    const otpInputs = document.querySelectorAll('.otp-input');
    
    otpInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const value = e.target.value;
        
        // Only allow numbers
        if (!/^\d$/.test(value)) {
          e.target.value = '';
          return;
        }
        
        // Move to next input
        if (value && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      
      input.addEventListener('keydown', (e) => {
        // Move to previous input on backspace
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
      
      // Handle paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = e.clipboardData.getData('text').trim();
        
        if (/^\d{6}$/.test(pastedData)) {
          pastedData.split('').forEach((char, i) => {
            if (otpInputs[i]) {
              otpInputs[i].value = char;
            }
          });
          otpInputs[5].focus();
        }
      });
    });

    // Auto-focus first input
    otpInputs[0].focus();

    // Verify OTP
    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const verifyBtn = document.getElementById('verifyBtn');
      const verifyBtnText = document.getElementById('verifyBtnText');
      const verifyBtnSpinner = document.getElementById('verifyBtnSpinner');
      
      // Get OTP code
      const otp = Array.from(otpInputs).map(input => input.value).join('');
      
      if (otp.length !== 6) {
        showAlert('Please enter all 6 digits');
        return;
      }
      
      verifyBtn.disabled = true;
      verifyBtnText.classList.add('d-none');
      verifyBtnSpinner.classList.remove('d-none');
      
      try {
        const response = await fetch(`${API_URL}/api/auth/verify-email`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, token: otp })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showAlert('Email verified successfully! Redirecting to login...', 'success');
          sessionStorage.removeItem('verifyEmail');
          
          setTimeout(() => {
            window.location.href = 'customer-login.html';
          }, 2000);
        } else {
          showAlert(data.error || 'Invalid or expired code. Please try again.');
          
          // Clear inputs
          otpInputs.forEach(input => input.value = '');
          otpInputs[0].focus();
          
          verifyBtn.disabled = false;
          verifyBtnText.classList.remove('d-none');
          verifyBtnSpinner.classList.add('d-none');
        }
      } catch (error) {
        console.error('Verification error:', error);
        showAlert('An error occurred. Please try again.');
        verifyBtn.disabled = false;
        verifyBtnText.classList.remove('d-none');
        verifyBtnSpinner.classList.add('d-none');
      }
    });

    // Resend OTP
    async function resendOTP() {
      if (resendCooldown > 0) return;
      
      const resendBtn = document.getElementById('resendBtn');
      const resendText = document.getElementById('resendText');
      const resendTimer = document.getElementById('resendTimer');
      
      resendBtn.disabled = true;
      
      try {
        const response = await fetch(`${API_URL}/api/auth/resend-otp`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          showAlert('New verification code sent to your email!', 'success');
          
          // Start cooldown (60 seconds)
          resendCooldown = 60;
          resendText.classList.add('d-none');
          resendTimer.classList.remove('d-none');
          
          cooldownInterval = setInterval(() => {
            resendCooldown--;
            resendTimer.textContent = `Resend in ${resendCooldown}s`;
            
            if (resendCooldown === 0) {
              clearInterval(cooldownInterval);
              resendText.classList.remove('d-none');
              resendTimer.classList.add('d-none');
              resendBtn.disabled = false;
            }
          }, 1000);
          
        } else {
          showAlert(data.error || 'Failed to resend code. Please try again.');
          resendBtn.disabled = false;
        }
      } catch (error) {
        console.error('Resend error:', error);
        showAlert('An error occurred. Please try again.');
        resendBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
