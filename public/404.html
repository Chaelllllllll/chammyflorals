<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
      body { display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#fffaf6; }
      .box { text-align:center; max-width:640px; padding:36px; border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,0.06); background:white; }
      h1 { margin:0 0 12px; color:#ff6f9b; }
      p { margin:0 0 18px; color:#555; }
      a.btn { display:inline-block; padding:10px 16px; border-radius:8px; background:#ff6f9b; color:#fff; text-decoration:none; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404 — Page Not Found</h1>
      <p>We couldn't find the page you're looking for. It may have been moved or deleted.</p>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
        <a class="btn" href="/">Home</a>
      </div>
    </div>
  </body>
</html>
