<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Chammy Florals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="flowers/cherry-blossom.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffebf3 0%, #ffe0ed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }
        .reset-container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
        }
        .reset-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(255, 111, 155, 0.2);
        }
        .reset-card h2 {
            color: #ff6f9b;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .form-control {
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            padding: 12px;
        }
        .form-control:focus {
            border-color: #ff6f9b;
            box-shadow: 0 0 0 0.2rem rgba(255, 111, 155, 0.25);
        }
        .btn-reset {
            background: linear-gradient(135deg, #ff99bb 0%, #ff6f9b 100%);
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 111, 155, 0.3);
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 111, 155, 0.4);
        }
        .back-link {
            color: #ff6f9b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            color: #ff5588;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="text-center mb-4">
                <i class="fa fa-key" style="font-size: 48px; color: #ff6f9b;"></i>
                <h2 class="mt-3">Reset Password</h2>
                <p class="text-muted">Enter your new password below</p>
            </div>

            <div id="alertContainer"></div>

            <form id="resetPasswordForm">
                <div class="mb-3">
                    <label class="form-label" style="font-weight: 600; color: #3a2b33;">New Password *</label>
                    <input type="password" class="form-control" id="newPassword" required minlength="6">
                    <small class="text-muted">Minimum 6 characters</small>
                </div>

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3a2b33;">Confirm Password *</label>
                    <input type="password" class="form-control" id="confirmPassword" required minlength="6">
                </div>

                <button type="submit" class="btn btn-reset">
                    <i class="fa fa-lock me-2"></i>Reset Password
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/customer-login.html" class="back-link">
                    <i class="fa fa-arrow-left me-2"></i>Back to Login
                </a>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="/css/notify-prompt.css">

    <script>
        // safe API base (falls back to same-origin)
        const API_ROOT = (window.API_URL && String(window.API_URL).replace(/\/$/, '')) || '';

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showAlert('danger', 'Invalid reset link');
            const form = document.getElementById('resetPasswordForm');
            if (form) form.style.display = 'none';
        }

        const form = document.getElementById('resetPasswordForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    showAlert('danger', 'Passwords do not match');
                    return;
                }

                if (newPassword.length < 6) {
                    showAlert('danger', 'Password must be at least 6 characters long');
                    return;
                }

                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin me-2"></i>Resetting...';

                try {
                    const response = await fetch(`${API_ROOT || ''}/api/auth/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: token,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showAlert('success', 'Password reset successfully! Redirecting to login...');
                        form.reset();
                        setTimeout(() => {
                            window.location.href = '/customer-login.html';
                        }, 2000);
                    } else {
                        showAlert('danger', data.error || 'Failed to reset password');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa fa-lock me-2"></i>Reset Password';
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showAlert('danger', 'An error occurred. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa fa-lock me-2"></i>Reset Password';
                }
            });
        }

        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            if (!alertContainer) return;
            alertContainer.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="border-radius: 10px;">
                    <i class="fa ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'} me-2"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/alert.js"></script>
</body>
</html>
