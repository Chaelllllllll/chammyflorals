<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ChamFlorals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary-pink: #ff85c1;
      --secondary-pink: #ffc1e3;
      --light-pink: #fff0f7;
      --dark-pink: #ff66ab;
      --text-dark: #1a1a1a;
      --text-muted: #666;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--light-pink) 0%, #ffffff 100%);
      min-height: 100vh;
    }
    
    .navbar {
      background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%);
      box-shadow: 0 2px 10px rgba(255, 102, 171, 0.2);
    }
    
    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      color: white !important;
    }
    
    .profile-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .profile-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(255, 102, 171, 0.15);
      overflow: hidden;
    }
    
    .profile-header {
      background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%);
      padding: 40px;
      text-align: center;
      position: relative;
    }
    
    .profile-photo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    
    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid white;
      object-fit: cover;
      box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    }
    
    .profile-name {
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    
    .profile-email {
      color: rgba(255,255,255,0.9);
      font-size: 16px;
    }
    
    .profile-body {
      padding: 40px;
    }
    
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .section-title i {
      color: var(--primary-pink);
    }
    
    .form-label {
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .form-control, .form-select {
      border: 2px solid #e8e8e8;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .form-control:focus, .form-select:focus {
      border-color: var(--primary-pink);
      box-shadow: 0 0 0 0.2rem rgba(255, 133, 193, 0.15);
    }
    
    .btn-save {
      background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%);
      color: white;
      border: none;
      padding: 12px 40px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 102, 171, 0.3);
    }
    
    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 102, 171, 0.4);
      color: white;
    }
    
    .btn-cancel {
      background: white;
      color: var(--text-muted);
      border: 2px solid #e8e8e8;
      padding: 12px 40px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    
    .btn-cancel:hover {
      border-color: var(--text-muted);
      color: var(--text-dark);
    }
    
    .alert {
      border-radius: 10px;
      border: none;
    }
    
    .alert-success {
      background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
      color: #155724;
    }
    
    .alert-danger {
      background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
      color: #721c24;
    }
    
    @media (max-width: 768px) {
      .profile-header {
        padding: 30px 20px;
      }
      
      .profile-body {
        padding: 30px 20px;
      }
      
      .profile-name {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fa fa-leaf me-2"></i>ChamFlorals
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Profile Container -->
  <div class="profile-container">
    <div class="profile-card">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-photo-container">
          <img id="profilePhoto" src="" alt="Profile Photo" class="profile-photo">
        </div>
        <h1 class="profile-name" id="profileName">Loading...</h1>
        <p class="profile-email" id="profileEmail"></p>
      </div>

      <!-- Profile Body -->
      <div class="profile-body">
        <div id="alertContainer"></div>
        
        <h2 class="section-title">
          <i class="fa fa-user-edit"></i>
          Personal Information
        </h2>
        
        <form id="profileForm">
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="name" name="name" required>
            </div>
            
            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email" disabled>
            </div>
            
            <div class="col-md-6">
              <label class="form-label">Phone Number *</label>
              <input type="tel" class="form-control" id="phone" name="phone" required>
            </div>
            
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" class="form-control" id="city" name="city" placeholder="e.g., Manila">
            </div>
            
            <div class="col-12">
              <label class="form-label">Address *</label>
              <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
            </div>
            
            <div class="col-12 mt-5">
              <div class="d-flex gap-3 justify-content-end">
                <button type="button" class="btn btn-cancel" onclick="window.location.href='dashboard.html'">
                  <i class="fa fa-times me-2"></i>Cancel
                </button>
                <button type="submit" class="btn btn-save">
                  <i class="fa fa-save me-2"></i>Save Changes
                </button>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/push-subscribe.js"></script>
  <script src="/js/notify-prompt.js"></script>
  <link rel="stylesheet" href="/css/notify-prompt.css">
</body>
</html>
